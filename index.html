<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شعار متجر Unifaye - مجوهرات راقية</title>
    <!-- استيراد الخطوط الفاخرة -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .font-luxury { font-family: 'Cinzel', serif; }
        .font-arabic-luxury { font-family: 'Tajawal', sans-serif; }
        .gold-grad {
            background: linear-gradient(135deg, #d4af37 0%, #fff2a3 50%, #aa771c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-border-grad {
            border-image: linear-gradient(to bottom, #d4af37, #aa771c) 1;
        }
    </style>
</head>
<body class="bg-[#0b0b0b] text-white flex items-center justify-center min-h-screen p-4">

    <!-- حاوية الشعار الاحترافية -->
    <div class="relative w-80 h-80 rounded-full bg-gradient-to-b from-[#121212] via-[#090909] to-[#121212] border-4 border-[#d4af37]/60 flex flex-col items-center justify-center p-6 shadow-[0_0_50px_rgba(212,175,55,0.15)] overflow-hidden text-center">
        
        <!-- إطار داخلي زخرفي إضافي -->
        <div class="absolute inset-2 rounded-full border border-[#d4af37]/25 pointer-events-none"></div>

        <!-- أيقونة الألماس الذهبية -->
        <svg class="w-14 h-14 text-amber-400 mb-2 drop-shadow-[0_2px_8px_rgba(212,175,55,0.4)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <path d="M6 3h12l4 6-10 13L2 9l4-6z"></path>
            <path d="M11 3L8 9l4 14 4-14-3-6"></path>
            <path d="M2 9h20"></path>
        </svg>

        <!-- اسم المتجر بالإنجليزية -->
        <h1 class="font-luxury text-3xl font-bold tracking-widest gold-grad uppercase mb-1">Unifaye</h1>

        <!-- خط فاصل ذهبي رفيع -->
        <div class="w-12 h-[1px] bg-gradient-to-r from-transparent via-amber-400 to-transparent my-2"></div>

        <!-- النص العربي: مجوهرات راقية -->
        <span class="font-arabic-luxury text-xs tracking-wider text-amber-200/90 font-medium">مجوهرات راقية</span>
        
    </div>

</body>
</html>
